# Visual-inertial odometry is required: an IMU alone cannot give drift-free velocity.
/**:
  ros__parameters:
    general:
      grab_resolution: 'HD720'
      grab_frame_rate: 30
      pub_frame_rate: 30.0
    sensors:
      publish_imu: true
      sensors_image_sync: false
      sensors_pub_rate: 100.0
    pos_tracking:
      pos_tracking_enabled: true
      imu_fusion: true
      publish_tf: true
      publish_map_tf: true
    depth:
      point_cloud_freq: 5.0
