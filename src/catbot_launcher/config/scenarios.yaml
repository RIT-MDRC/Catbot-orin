# Shared defaults for all four scenario launch files; each key is also a CLI argument.
workspace: /home/catbot/projects/ros2_ws
remote_host: 192.168.0.3
remote_user: catbot
remote_workspace: /home/catbot/main
# Sources ROS and the Pi's shared DDS exports before its workspace and nodes.
remote_environment: /home/catbot/.config/catbot/ros_environment.bash
run_id: ''
checkpoint: ''
policy_entity: hiromon-rochester-institute-of-technology
policy_project: catbot
policy_artifacts_directory: '{workspace}/external/Catbot/src/catbot_policy/artifacts'
remote_policy_artifacts_directory: '{remote_workspace}/src/catbot_policy/artifacts'
remote_policy_bundle: '{remote_workspace}/src/catbot_policy/artifacts/selected/bundle'
remote_mapping_file: '{remote_workspace}/src/catbot_policy/catbot_policy/default_mapping.json'
policy_bundle: '{workspace}/external/Catbot/src/catbot_policy/artifacts/selected/bundle'
mapping_file: '{workspace}/default_mapping.json'
rollout_repository: '{workspace}/external/catbot_sim_rollout'
run_directory: '{workspace}/external/Catbot/src/catbot_policy/artifacts/selected'
uv_executable: uv
# Policy defaults to CUDA; orin_device:=cpu selects the modern CPU policy.
orin_device: cuda:0
# Simulation/kinematics still require the modern training stack, separate from policy.
device: cpu
policy_device: '{orin_device}'
remote_policy_device: cpu
# Orin: JetPack 6.2.3+b81 / L4T 36.5.2-20260716114719 (reported target versions).
# CUDA environments still need compatible Python/PyTorch builds; see docs/SIMULATION.md.
worker_environment: auto
worker_sync: auto
policy_worker_environment: auto
policy_worker_sync: auto
remote_policy_worker_environment: auto
remote_policy_worker_sync: auto
policy_torch_compatibility: auto
remote_policy_torch_compatibility: auto
command_timeout: 0.25
worker_timeout: 2.0
feedback_timeout: 0.25
visualization_rate: 30.0
startup_timeout: 120.0
sensor_timeout: 0.25
sensor_max_skew: 0.1
ground_height_offset: 0.35
contact_height: 0.02
estimate_contacts: true
body_from_camera_wxyz: [1.0, 0.0, 0.0, 0.0]
body_from_imu_wxyz: [1.0, 0.0, 0.0, 0.0]
body_to_camera_xyz: [0.0, 0.0, 0.0]
imu_includes_gravity: true
camera_model: zed2i
camera_name: zed
serial_number: '0'
imu_topic: '/{camera_name}/zed_node/imu/data'
odom_topic: '/{camera_name}/zed_node/odom'
contact_topic: /body/state/foot_contacts
enable_foxglove: true
enable_diagnostics: true
# Health reporting thresholds, independent of the motion-control safety timeouts.
diagnostics_stream_timeout: 2.0
diagnostics_frame_timeout: 10.0
foxglove_address: 0.0.0.0
foxglove_port: 8765

# auto selects Python 3.10 for CUDA policy and 3.14 for CPU policy.
policy_python: auto
remote_policy_python: auto

# ROS adapters keep the ROS-compatible interpreter; these are separate from inference.
policy_ros_python: /usr/bin/python3
remote_policy_ros_python: /usr/bin/python3
policy_worker_project: '{workspace}/external/Catbot/src/catbot_policy/catbot_policy/inference'
remote_policy_worker_project: '{remote_workspace}/src/catbot_policy/catbot_policy/inference'
policy_uv_executable: uv
remote_policy_uv_executable: uv
policy_worker_timeout: 2.0
policy_startup_timeout: 120.0
