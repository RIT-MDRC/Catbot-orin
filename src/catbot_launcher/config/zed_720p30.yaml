# Diagnostic profile: same resolution as zed_usb_test.yaml, at 30 FPS.
# Launch with: ros2 launch catbot_launcher main.launch.py config_file:="$PWD/src/catbot_launcher/config/zed_720p30.yaml"
/**:
  ros__parameters:
    debug:
      sdk_verbose: 2
      sdk_verbose_log_file: '/tmp/zed-sdk.log'
      # debug_common: true
      # debug_grab: true
      debug_video_depth: true
    general:
      grab_resolution: 'HD720'
      grab_frame_rate: 30
      pub_frame_rate: 5.0
    depth:
      point_cloud_freq: 10.0
